name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: staging
    env:
      DOJO_USER_MEMBER_EMAIL: ${{ secrets.DOJO_USER_MEMBER_EMAIL }}
      DOJO_USER_MEMBER_PASSWORD: ${{ secrets.DOJO_USER_MEMBER_PASSWORD }}
      DOJO_USER_ADMIN_EMAIL: ${{ secrets.DOJO_USER_ADMIN_EMAIL }}
      DOJO_USER_ADMIN_PASSWORD: ${{ secrets.DOJO_USER_ADMIN_PASSWORD }}
      TEST_ENV: staging
      USER_ROLE: member

    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun ci

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      - name: Run Playwright tests
        run: bunx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
